{% extends 'base.html' %}
{% block title %}Forgot Password{% endblock %}
{% block auth_body %}
  <h1>Forgot Password</h1>
  <p class="auth-subtitle">Enter your registered university email to receive a password reset link.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email Address</label>
    <input id="email" name="email" type="email" placeholder="example@uni.edu" autofocus>
    <button class="btn-pill" type="submit">Send reset link</button>
  </form>
  <div class="auth-footer-links">
    <a href="{{ url_for('auth.login') }}">&larr; Back to login</a>
  </div>
{% endblock %}
