{% extends 'base.html' %}{% block body %}<h1>Absence Request</h1>
<div class="card"><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Class session</label><select name="class_session_id">{% for s in sessions %}<option value="{{ s.class_session_id }}">{{ s.session_date }} - {{ s.class_name }}</option>{% endfor %}</select>
<label>Reason</label><textarea name="reason" rows="3"></textarea><label>Evidence (PDF/PNG/JPG, optional)</label><input type="file" name="attachment"><button class="btn">Submit request</button></form></div>
<div class="card table-wrap"><h2>My requests</h2><table><tr><th>Session</th><th>Class</th><th>Reason</th><th>Status</th></tr>{% for r in requests %}<tr><td>{{ r.session_date }}</td><td>{{ r.class_name }}</td><td>{{ r.reason }}</td><td><span class="badge {{ r.status }}">{{ r.status.title() }}</span></td></tr>{% else %}<tr><td colspan="4" class="muted">No requests yet.</td></tr>{% endfor %}</table></div>{% endblock %}
