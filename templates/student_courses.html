{% extends 'base.html' %}{% block body %}<h1>My Courses</h1><div class="card table-wrap"><table><tr><th>Class</th><th>Course</th><th>Semester</th><th>Lecturer</th></tr>
{% for c in classes %}<tr><td>{{ c.class_code }}</td><td>{{ c.course_name }}</td><td>{{ c.semester }}</td><td>{{ c.lecturer_name }}</td></tr>{% else %}<tr><td colspan="4" class="muted">You are not enrolled in any class.</td></tr>{% endfor %}</table></div>{% endblock %}
