{% extends 'base.html' %}{% block body %}<div class="card narrow"><h1>My Profile</h1><p class="muted">Username: {{ u.username }} &middot; Role: {{ u.role.title() }}</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name</label><input name="full_name" value="{{ u.full_name }}">
<label>Email</label><input name="email" value="{{ u.email }}"><label>Phone</label><input name="phone" value="{{ u.phone }}"><button class="btn">Save</button></form></div>{% endblock %}
